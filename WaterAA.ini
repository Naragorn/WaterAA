[Main]
; 1 = the plugin does its work, 0 = it does nothing.
Enable=1

[Water]
; From how far away the water's reflection stops getting more restless, in
; the game's units (about 70 units are a metre, 21 a foot).
;
; The game makes reflections wobble with the waves, and lets the wobble grow
; with the distance, out to 5000 units. Far off the waves are smaller than a
; pixel but the wobble is still tens of pixels wide, so distant reflections
; break up into flickering streaks. Nearer than this distance the water looks
; exactly as before; beyond it the wobble fades the way the waves do, and the
; far shore mirrors calmly.
;
;   200   - the default: clearly calmer far water, the water around you
;           untouched.
;   100   - calmer still, close to a mirror in the distance.
;   600   - only a little calmer than the game's own.
;   5000  - the game's own (nothing is changed).
; Allowed: 50 to 4999.
CalmFrom=200
